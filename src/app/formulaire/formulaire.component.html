<ion-header>
  <ion-toolbar>
    <ion-title></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="signup-container">
    <h1>Bienvenue !</h1>
    <p>Connectez-vous pour continuer</p>
    
    <!-- Formulaire d'inscription -->
    <!-- <ion-item lines="none" class="input-item">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-input placeholder="Nom complet" [(ngModel)]="user.name"></ion-input>
    </ion-item> -->

    <ion-item lines="none" class="input-item">
      <ion-icon name="mail-outline" slot="start"></ion-icon>
      <ion-input type="email" placeholder="Email" [(ngModel)]="user.email"></ion-input>
    </ion-item>

    <ion-item lines="none" class="input-item">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-input type="password" placeholder="Mot de passe" [(ngModel)]="user.password"></ion-input>
    </ion-item>

    <!-- <ion-item lines="none" class="input-item">
      <ion-icon name="call-outline" slot="start"></ion-icon>
      <ion-input type="tel" placeholder="Numéro de téléphone" [(ngModel)]="user.phone"></ion-input>
    </ion-item> -->

    
    <!-- Bouton d'inscription -->
    <ion-button expand="block" (click)="registerUser()" class="register-btn" [routerLink]="['/tabs/tab1']" >
      Connexion
    </ion-button>

    <div class="already-account">
      <p>Vous avez déjà un compte ? <a [routerLink]="['/login']">S'inscrire </a></p>
    </div>
  </div>
</ion-content>
