<ion-header class="=custom">
  <ion-toolbar class="custom">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/" ></ion-back-button>
    </ion-buttons>
    <ion-title>Contact Support</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Conteneur avec un visuel moderne -->
  <div class="support-wrapper">
    <ion-card class="support-card">
      <ion-card-header class="ion-text-center">
         <ion-avatar class="support-avatar">
          <img src="../../assets/istockphoto-1319388111-170x170.jpg" alt="Support Icon">
        </ion-avatar> 
        <ion-card-title>Besoin d'aide ?</ion-card-title>
        <ion-card-subtitle>Nous sommes là pour vous aider !</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <!-- <ion-item class="support-item">
          <ion-label position="floating">Nom</ion-label>
          <ion-input [(ngModel)]="userName" placeholder="Votre nom" class="input-field">
            <ion-icon name="person-outline" slot="end"></ion-icon>
          </ion-input>
        </ion-item>

        <ion-item class="support-item">
          <ion-label position="floating">Email</ion-label>
          <ion-input [(ngModel)]="userEmail" type="email" placeholder="Votre email" class="input-field">
            <ion-icon name="mail-outline" slot="end"></ion-icon>
          </ion-input>
        </ion-item> -->

        <ion-item class="support-item">
          <ion-label position="floating">Sujet</ion-label>
          <ion-input [(ngModel)]="subject" placeholder="Sujet de votre demande" class="input-field">
            <ion-icon name="chatbubbles-outline" slot="end"></ion-icon>
          </ion-input>
        </ion-item>

        <ion-item class="support-item">
          <ion-label position="floating">Message</ion-label>
          <ion-textarea [(ngModel)]="message" placeholder="Expliquez-nous votre problème ou question" class="textarea-field">
          </ion-textarea>
        </ion-item>

        <ion-button expand="block" color="danger" (click)="sendMessage()" class="send-button">
          <ion-icon name="paper-plane-outline" slot="start"></ion-icon>
          Envoyer le message
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>



  <!-- Options de support rapide -->
  <ion-list>
    <ion-list-header>Support rapide</ion-list-header>

    <ion-item button (click)="contactSupport('email')">
      <ion-icon slot="start" name="mail-outline"></ion-icon>
      <ion-label>Email</ion-label>
    </ion-item>

    <ion-item button (click)="contactSupport('chat')">
      <ion-icon slot="start" name="chatbubble-outline"></ion-icon>
      <ion-label>Chat en direct</ion-label>
    </ion-item>

    <ion-item button (click)="contactSupport('phone')">
      <ion-icon slot="start" name="call-outline"></ion-icon>
      <ion-label>Appelez-nous</ion-label>
    </ion-item>
  </ion-list>

  <!-- Liens d'aide rapides -->
  <ion-list>
    <ion-list-header>Aide rapide</ion-list-header>

    <ion-item button (click)="openFAQ()">
      <ion-icon slot="start" name="help-outline"></ion-icon>
      <ion-label>FAQ</ion-label>
    </ion-item>

    <ion-item button (click)="openDocumentation()">
      <ion-icon slot="start" name="document-text-outline"></ion-icon>
      <ion-label>Documentation</ion-label>
    </ion-item>

    <ion-item button (click)="openTutorials()">
      <ion-icon slot="start" name="videocam-outline"></ion-icon>
      <ion-label>Vidéos Tutoriels</ion-label>
    </ion-item>
  </ion-list>

</ion-content>
