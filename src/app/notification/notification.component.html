<ion-content [fullscreen]="true">
  <!-- Overview Card pour Notifications -->
  <div class="overview-card">
    <div class="overview-content">
      <div class="overview-icon">
        <ion-icon name="notifications"></ion-icon>
      </div>
      <div class="overview-info">
        <h2 class="overview-title">Mes Notifications</h2>
        <p class="overview-subtitle overview-amount" *ngIf="unreadNotifications > 0">{{ unreadNotifications }} nouvelle(s)</p>
        <p class="overview-subtitle overview-amount" *ngIf="unreadNotifications === 0">À jour</p>
      </div>
    </div>
    <div class="overview-stats">
      <div class="stat-item">
        <span class="stat-value">{{ notifications.length }}</span>
        <span class="stat-label">Total</span>
      </div>
    </div>
  </div>

  <!-- Bouton Effacer tout -->
  <div class="clear-all-section" *ngIf="notifications.length > 0">
    <ion-button fill="clear" class="clear-all-btn" (click)="clearAllNotifications()">
      <ion-icon name="trash-outline"></ion-icon>
      Effacer tout
    </ion-button>
  </div>

  <!-- Message vide si aucune notification -->
  <div class="empty-state" *ngIf="notifications.length === 0">
    <div class="empty-icon">
      <ion-icon name="notifications-off-outline"></ion-icon>
    </div>
    <h2>Aucune notification</h2>
    <p>Vous êtes à jour ! Aucune nouvelle notification pour le moment.</p>
  </div>

  <!-- Liste des notifications -->
  <div class="notifications-container" *ngIf="notifications.length > 0">
    <div class="notification-card" *ngFor="let notification of notifications; let i = index" 
         [style.animation-delay]="i * 0.1 + 's'">
      <div class="notification-content">
        <div class="notification-avatar">
          <img [src]="notification.image" alt="Avatar" (error)="onImageError($event)">
        </div>
        
        <div class="notification-details">
          <h3 class="notification-title">{{ notification.title }}</h3>
          <p class="notification-message">{{ notification.message }}</p>
          <div class="notification-footer">
            <span class="notification-time">
              <ion-icon name="time-outline"></ion-icon>
              {{ getTimeAgo(notification.time) }}
            </span>
          </div>
        </div>
      </div>

      <div class="notification-actions">
        <ion-button fill="clear" size="small" class="action-btn view-btn">
          <ion-icon name="eye-outline"></ion-icon>
        </ion-button>
        <ion-button fill="clear" size="small" class="action-btn delete-btn" (click)="deleteNotification(i)">
          <ion-icon name="close-outline"></ion-icon>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
